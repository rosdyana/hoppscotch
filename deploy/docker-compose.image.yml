# Overlay that runs a pre-built AIO image instead of building from source.
#
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.image.yml pull
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.image.yml up -d
#
# Defaults to this fork's image, built and pushed by
# .github/workflows/build-fork-image.yml on every version tag.
#
# To run upstream's stock image instead, set in .env:
#   HOPP_IMAGE=hoppscotch/hoppscotch:latest
# To pin a specific release of your fork:
#   HOPP_IMAGE=ghcr.io/rosdyana/hoppscotch:1.0.0
#
# Use this rather than building locally: the frontend build runs vite with
# --max_old_space_size=8192 and is OOM-killed on a 4 GB machine.

services:
  hoppscotch:
    # !reset drops the `build:` block from docker-compose.prod.yml so compose
    # never tries to build; it only ever pulls.
    build: !reset null
    image: ${HOPP_IMAGE:-ghcr.io/rosdyana/hoppscotch:latest}
