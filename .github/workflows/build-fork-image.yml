# Builds this fork's all-in-one image and pushes it to GHCR.
#
# Triggered by pushing a version tag, matching upstream's release workflow:
#   git tag 1.0.0 && git push origin 1.0.0
# workflow_dispatch is also enabled so you can build a tag by hand from the
# Actions tab without pushing a new one.
#
# Builds ONLY the `aio` target for linux/amd64 — that is what the Debian server
# runs. Upstream additionally builds backend/app/sh_admin and arm64; arm64 goes
# through QEMU emulation and is dramatically slower, so it is omitted here.
#
# Why CI and not a laptop: the frontend build runs vite with
# --max_old_space_size=8192, and gets OOM-killed on a 4 GB machine. GitHub's
# standard runners provide 16 GB on public repositories.

name: Build fork image and push to GHCR

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to GHCR; no secrets needed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner ships with toolchains this build never uses. Removing them
      # frees ~20 GB, which the multi-stage build needs for its layers.
      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          echo "after:"; df -h / | tail -1

      # prod.Dockerfile's base_builder does `COPY . .`; upstream's release
      # workflow seeds a .env the same way before building.
      - name: Setup environment
        run: cp .env.example .env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces :<tag> (e.g. 1.0.0), :1.0, and :latest, plus a :sha- tag so
      # every build is addressable even if a tag is later moved.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push the AIO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./prod.Dockerfile
          target: aio
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork-aio
          cache-to: type=gha,mode=max,scope=fork-aio

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Deploy with: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
